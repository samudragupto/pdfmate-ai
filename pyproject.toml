[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmate-ai"
version = "1.0.0"
description = "Local-First Agentic Document Mentor for On-Device Consumer Hardware"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
mypy_path = "src"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

